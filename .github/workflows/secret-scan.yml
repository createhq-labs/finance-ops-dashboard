name: Secret Scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for blocked secrets
        shell: bash
        run: |
          set -euo pipefail

          EXCLUDES=(
            '--exclude-dir=.git'
            '--exclude-dir=node_modules'
            '--exclude-dir=.next'
            '--exclude-dir=dist'
            '--exclude-dir=coverage'
            '--exclude=package-lock.json'
          )

          fail=0

          echo 'Checking for SUPABASE_SERVICE_ROLE_KEY...'
          if grep -RInE "SUPABASE_SERVICE_ROLE_KEY" . "${EXCLUDES[@]}"; then
            echo 'Blocked pattern found: SUPABASE_SERVICE_ROLE_KEY'
            fail=1
          fi

          echo 'Checking for service_role tokens...'
          if grep -RInE "service_role" . "${EXCLUDES[@]}"; then
            echo 'Blocked pattern found: service_role'
            fail=1
          fi

          echo 'Checking for JWT-like strings (eyJ...)...'
          if grep -RInE "eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}" . "${EXCLUDES[@]}"; then
            echo 'Blocked pattern found: JWT-like token'
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo 'Secret scan failed.'
            exit 1
          fi

          echo 'Secret scan passed.'